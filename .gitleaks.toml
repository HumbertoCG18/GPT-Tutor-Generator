# gitleaks (#54): regras padrao + excecao estreita.
[extend]
useDefault = true

# Relatorios citam SHAs de commit git (40 hex), que casam com o formato legado
# de token do Sourcegraph. O projeto nao usa Sourcegraph; so esse formato exato e ignorado.
[[allowlists]]
description = "SHA de commit git"
targetRules = ["sourcegraph-access-token"]
regexTarget = "secret"
regexes = ['''^[0-9a-f]{40}$''']

# Manifestos do harness listam o sha256 de arquivos "resumo*.json"; "resumo" contem "sumo" e casa a regra
# do Sumo Logic. O projeto nao usa Sumo Logic; so esse formato exato (chave .json + 64 hex), no harness, e ignorado.
[[allowlists]]
description = "sha256 de arquivo resumo*.json em manifesto do harness"
targetRules = ["sumologic-access-token"]
condition = "AND"
regexTarget = "match"
regexes = ['''resumo[\w.-]*\.json"\s*:\s*"[0-9a-f]{64}''']
paths = ['''^docs/reports/_harness-2026-09-04/''']
