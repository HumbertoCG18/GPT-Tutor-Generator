name: Registry guard

# The campaign registry and the findings box change only on the main checkout, where they live
# uncommitted until a chore(workflow) commit made there or a chore(workflow) PR that changes only them.
# A code PR that also changes them makes the next pull of the main checkout fail.
# Policy: agent-workflow-lab references/campaigns.md, "Escrita".
# Canonical copy: agent-workflow-lab ci/registry-guard.yml; projects copy it unchanged.
on:
  pull_request:

jobs:
  registry:
    # Syncing one trunk into another may carry registry commits made on the main checkout.
    if: ${{ !startsWith(github.head_ref, 'sync/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The PR leaves the registry alone or changes nothing else
        # The checkout is the PR's merge commit: ^1 is the base, ^2 the PR head.
        run: |
          changed=$(git diff --name-only HEAD^1...HEAD^2 -- .workflow/campanhas.json .workflow/achados.json)
          others=$(git diff --name-only HEAD^1...HEAD^2 -- . ':!.workflow/campanhas.json' ':!.workflow/achados.json')
          if [ -n "$changed" ] && [ -n "$others" ]; then
            echo "::error::This PR changes $(echo $changed) along with other files. Registry changes go in a chore(workflow) commit or PR of their own, made from the main checkout (campanhas.py or the Alethe Todo List)."
            exit 1
          fi
