[project]
name = "academic-tutor-repo-builder"
version = "3.0.0"
description = "Converts academic PDFs into curated knowledge repositories for AI tutoring systems."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
    # <1.28: com 1.28.2 a fração empilhada some do markdown (#71).
    "pymupdf4llm>=0.0.10,<1.28",
    "pdfplumber>=0.10.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]
# Optional: enable Gemini-based code summarization (course/code_curation.json).
# Without this extra, the build still works — code summaries are simply skipped.
code-summarization = [
    "google-genai>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Comeco conservador: erro real, nao estilo. 108k LOC sem lint ate hoje —
# ligar regra de estilo agora produziria milhares de achados e zero sinal.
select = ["E9", "F", "B"]
